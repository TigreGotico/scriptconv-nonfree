[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptconv-nonfree"
dynamic = ["version"]
description = "scriptconv phonemizer backends whose code, data or dependencies are non-commercial or carry no licence grant"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND MIT AND CC-BY-NC-4.0 AND LicenseRef-AfricaG2P-Data"
license-files = [
    "LICENSE",
    "scriptconv_nonfree/phonemizers/_vendored/mantoq/LICENSE.md",
    "scriptconv_nonfree/phonemizers/_vendored/mantoq/LICENSE.mantoq",
    "scriptconv_nonfree/phonemizers/_vendored/mantoq/LICENSE.cc-by-nc-4.0",
    "scriptconv_nonfree/phonemizers/_vendored/iqra_phonetiser/LICENSE.md",
    "scriptconv_nonfree/phonemizers/_vendored/iqra_phonetiser/LICENSE.cc-by-nc-4.0",
    "LICENSE.africa-g2p-data.md",
]
dependencies = ["scriptconv[phonemizers]>=0.0.4a98"]
authors = [
    { name = "TigreGotico", email = "contact@tigregotico.com" }
]
keywords = ["g2p", "phonemizer", "tts", "scriptconv", "arabic", "mantoq", "halabi", "iqra", "vietnamese", "african-languages"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
ar-phonemizers = ["ovos-number-parser"]
vi = ["viphoneme; python_version<'3.12'", "vinorm; python_version<'3.12'", "underthesea; python_version<'3.12'", "eng_to_ipa; python_version<'3.12'"]
africa = ["africa-g2p>=0.3.5"]
ghana = ["ghana-g2p>=0.1.1", "africa-g2p>=0.3.5"]
test = ["pytest", "pytest-timeout", "ovos-number-parser", "africa-g2p>=0.3.5", "ghana-g2p>=0.1.1", "viphoneme; python_version<'3.12'", "vinorm; python_version<'3.12'", "underthesea; python_version<'3.12'", "eng_to_ipa; python_version<'3.12'", "linguatag[langcodes]>=0.2.3a1", "packaging"]

[project.urls]
Homepage = "https://github.com/TigreGotico/scriptconv-nonfree"
Repository = "https://github.com/TigreGotico/scriptconv-nonfree"
Issues = "https://github.com/TigreGotico/scriptconv-nonfree/issues"

[tool.setuptools.packages.find]
include = ["scriptconv_nonfree*"]

[tool.setuptools.dynamic]
version = {attr = "scriptconv_nonfree.version.__version__"}

[tool.setuptools.package-data]
"scriptconv_nonfree.phonemizers._vendored.mantoq" = ["LICENSE*"]
"scriptconv_nonfree.phonemizers._vendored.iqra_phonetiser" = ["LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 150

[tool.ruff]
extend-exclude = ["*/_vendored/*"]
